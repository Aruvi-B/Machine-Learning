<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Tool Selection & Project Dependencies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f0f3ff;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .upload-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .file-input {
            padding: 10px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            background: white;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .form-section {
            margin-bottom: 30px;
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section h2::before {
            content: "🛠️";
            font-size: 1.2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .checkbox-item:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-item.checked {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .results-section {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            border-radius: 15px;
            border-left: 5px solid #a8edea;
        }

        .results-section h2::before {
            content: "🎯";
        }

        .tool-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }

        .tool-card.priority-1 {
            border-left-color: #28a745;
        }

        .tool-card.priority-2 {
            border-left-color: #ffc107;
        }

        .tool-card.priority-3 {
            border-left-color: #dc3545;
        }

        .tool-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tool-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
        }

        .priority-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
        }

        .priority-1 .priority-badge {
            background: #28a745;
        }

        .priority-2 .priority-badge {
            background: #ffc107;
        }

        .priority-3 .priority-badge {
            background: #dc3545;
        }

        .capabilities {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .capability {
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            text-align: center;
        }

        .capability.yes {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .capability.no {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .capability.na {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e1e5e9;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        .filter-summary {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e1e5e9;
        }

        .filter-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin: 2px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .capabilities {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Smart Tool Selection System</h1>
            <p>Upload your tools database and get personalized recommendations</p>
        </div>

        <!-- File Upload Section -->
        <div class="upload-section">
            <h3>📊 Upload Tools Database</h3>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="file-input" onchange="handleFileUpload(event)">
            <div id="fileStatus" style="margin-top: 10px; font-size: 0.9em; color: #666;"></div>
        </div>

        <form id="projectForm">
            <!-- Project Basic Info -->
            <div class="form-section">
                <h2>Project Information</h2>
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" class="form-control" placeholder="Enter your project name" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription">Project Description</label>
                    <textarea id="projectDescription" class="form-control" rows="3" placeholder="Describe your training project..."></textarea>
                </div>
            </div>

            <!-- Category Selection -->
            <div class="form-section">
                <h2>Select Required Capabilities</h2>
                <p style="margin-bottom: 15px; color: #666;">Choose the capabilities you need for your project:</p>
                <div class="checkbox-grid">
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Simulation')">
                        <input type="checkbox" id="sim" name="capabilities[]" value="Simulation">
                        <label for="sim">🔬 Simulation</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Schematics')">
                        <input type="checkbox" id="sch" name="capabilities[]" value="Schematics">
                        <label for="sch">📐 Schematics</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Shell')">
                        <input type="checkbox" id="shell" name="capabilities[]" value="Shell">
                        <label for="shell">💻 Shell</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Dashboard - Visualise data signals')">
                        <input type="checkbox" id="dash" name="capabilities[]" value="Dashboard - Visualise data signals">
                        <label for="dash">📊 Dashboard - Visualise Data Signals</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Compiler')">
                        <input type="checkbox" id="comp" name="capabilities[]" value="Compiler">
                        <label for="comp">⚙️ Compiler</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Debugger')">
                        <input type="checkbox" id="debug" name="capabilities[]" value="Debugger">
                        <label for="debug">🐛 Debugger</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCapability(this, 'Circuit Design')">
                        <input type="checkbox" id="circuit" name="capabilities[]" value="Circuit Design">
                        <label for="circuit">🔌 Circuit Design</label>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
                <button type="button" class="btn btn-primary" onclick="findMatchingTools()">🔍 Find Matching Tools</button>
            </div>
        </form>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section" style="display: none;">
            <h2>Recommended Tools</h2>
            <div id="filterSummary" class="filter-summary"></div>
            <div id="toolsResults"></div>
        </div>
    </div>

    <script>
        let toolsDatabase = [];
        let selectedCapabilities = new Set();

        // Sample tools data based on your Excel structure
        const sampleToolsData = [
//get the data from the excel sheet
]
        // Initialize with sample data
        toolsDatabase = sampleToolsData;
        document.getElementById('fileStatus').innerHTML = '✅ Sample tools database loaded (5 tools)';

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileStatus').innerHTML = '⏳ Processing file...';

            try {
                if (file.name.endsWith('.csv')) {
                    await handleCSVFile(file);
                } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    await handleExcelFile(file);
                }
                
                document.getElementById('fileStatus').innerHTML = `✅ File loaded successfully (${toolsDatabase.length} tools)`;
            } catch (error) {
                document.getElementById('fileStatus').innerHTML = `❌ Error loading file: ${error.message}`;
                console.error('File loading error:', error);
            }
        }

        async function handleCSVFile(file) {
            const text = await file.text();
            const Papa = await import('https://cdn.skypack.dev/papaparse@5.3.2');
            
            const result = Papa.default.parse(text, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true
            });

            toolsDatabase = result.data.filter(row => row.TOOLS && row.TOOLS.trim() !== '');
        }

        async function handleExcelFile(file) {
            // For Excel files, you would need to use SheetJS or similar
            // For now, we'll show an instruction message
            document.getElementById('fileStatus').innerHTML = '📝 For Excel files, please save as CSV and upload. Using sample data for now.';
        }

        function toggleCapability(element, capability) {
            const checkbox = element.querySelector('input[type="checkbox"]');
            const isChecked = !checkbox.checked;
            
            checkbox.checked = isChecked;
            
            if (isChecked) {
                element.classList.add('checked');
                selectedCapabilities.add(capability);
            } else {
                element.classList.remove('checked');
                selectedCapabilities.delete(capability);
            }
        }

        function findMatchingTools() {
            if (selectedCapabilities.size === 0) {
                alert('Please select at least one capability to find matching tools.');
                return;
            }

            const projectName = document.getElementById('projectName').value;
            if (!projectName) {
                alert('Please enter a project name.');
                return;
            }

            // Filter tools based on selected capabilities
            const matchingTools = toolsDatabase.filter(tool => {
                return Array.from(selectedCapabilities).some(capability => {
                    const value = tool[capability];
                    return value && value.toString().toLowerCase().includes('yes');
                });
            });

            // Sort by priority level
            matchingTools.sort((a, b) => (a["Priority level"] || 999) - (b["Priority level"] || 999));

            displayResults(matchingTools);
        }

        function displayResults(tools) {
            const resultsSection = document.getElementById('resultsSection');
            const filterSummary = document.getElementById('filterSummary');
            const toolsResults = document.getElementById('toolsResults');

            // Show results section
            resultsSection.style.display = 'block';

            // Update filter summary
            filterSummary.innerHTML = `
                <strong>🔍 Searching for tools with:</strong><br>
                ${Array.from(selectedCapabilities).map(cap => `<span class="filter-tag">${cap}</span>`).join('')}
                <br><strong>Found ${tools.length} matching tools</strong>
            `;

            // Display tools
            if (tools.length === 0) {
                toolsResults.innerHTML = `
                    <div class="empty-state">
                        <h3>🚫 No matching tools found</h3>
                        <p>Try selecting different capabilities or check your tools database.</p>
                    </div>
                `;
                return;
            }

            toolsResults.innerHTML = tools.map(tool => {
                const priorityClass = `priority-${tool["Priority level"] || 3}`;
                
                return `
                    <div class="tool-card ${priorityClass}">
                        <div class="tool-header">
                            <div class="tool-name">${tool.TOOLS}</div>
                            <div class="priority-badge">Priority ${tool["Priority level"] || 'N/A'}</div>
                        </div>
                        <div style="margin-bottom: 10px;">
                            <strong>Category:</strong> ${tool.Category || 'N/A'} | 
                            <strong>Type:</strong> ${tool["WEB / Container"] || 'N/A'}
                        </div>
                        <div class="capabilities">
                            ${['Simulation', 'Schematics', 'Shell', 'Dashboard - Visualise data signals', 'Compiler', 'Debugger', 'Circuit Design']
                                .map(cap => {
                                    const value = tool[cap] || 'NA';
                                    const className = value.toLowerCase().includes('yes') ? 'yes' : 
                                                    value.toLowerCase().includes('no') ? 'no' : 'na';
                                    return `<div class="capability ${className}">${cap}: ${value}</div>`;
                                }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            // Scroll to results
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('projectForm').reset();
            selectedCapabilities.clear();
            
            document.querySelectorAll('.checkbox-item.checked').forEach(item => {
                item.classList.remove('checked');
            });
            
            document.getElementById('resultsSection').style.display = 'none';
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Tool Selection System initialized with sample data');
        });
    </script>
</body>
</html>
